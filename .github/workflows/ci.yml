name: CI

# Cost model (public repo, no schedules, macOS still manual/tag only):
# Ubuntu shellcheck + python-gate ~0.5-1 min per qualifying push/PR.
# At ~60 events/month that is about 30-60 extra Ubuntu minutes.
# macOS full suite stays workflow_dispatch/tag only.

on:
  push:
    branches: [main, master]
    paths:
      - '**.sh'
      - '**.py'
      - '**.md'
      - 'lib/**'
      - 'config/**'
      - 'tests/**'
      - 'dev_sync/**'
      - 'scripts/**'
      - '.github/**'
      - '.gitleaks.toml'
      - 'VERSION'
      - 'pyproject.toml'
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths:
      - '**.sh'
      - '**.py'
      - '**.md'
      - 'lib/**'
      - 'config/**'
      - 'tests/**'
      - 'dev_sync/**'
      - 'scripts/**'
      - '.github/**'
      - '.gitleaks.toml'
      - 'VERSION'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: bash -n + py_compile + unittest
    # macOS runner: closest to the real target environment (bash 3.2 default).
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show environment
        run: |
          bash --version | head -1
          python3 --version
          sw_vers || true
          test -f VERSION && echo "VERSION=$(tr -d '[:space:]' < VERSION)"

      - name: Run full test suite
        run: bash run_tests.sh

  python-gate:
    name: portable Python compile + unittest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: py_compile and unittest
        run: |
          set -o pipefail
          python3 -m py_compile lib/python/*.py dev_sync/*.py scripts/*.py tests/*.py
          PYTHONPATH=dev_sync:lib/python python3 -m unittest discover tests

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint all shell scripts
        run: |
          set -o pipefail
          count="$(find . -type f -name '*.sh' \
            ! -path './.git/*' \
            ! -path './graphify-out/*' \
            ! -path './dev_sync_logs/*' \
            | wc -l | tr -d ' ')"
          echo "Linting ${count} shell scripts (see .shellcheckrc)"
          find . -type f -name '*.sh' \
            ! -path './.git/*' \
            ! -path './graphify-out/*' \
            ! -path './dev_sync_logs/*' \
            -print0 | xargs -0 shellcheck --severity=warning
