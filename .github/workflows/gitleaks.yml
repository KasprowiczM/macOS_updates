name: Secret scan

on:
  push:
    branches: [main, master]
    paths:
      - '**.sh'
      - 'lib/**'
      - 'config/**'
      - 'tests/**'
      - '.github/**'
      - '.gitleaks.toml'
      - 'VERSION'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.sh'
      - 'lib/**'
      - 'config/**'
      - 'tests/**'
      - '.github/**'
      - '.gitleaks.toml'
      - 'VERSION'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks + forbidden tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Forbidden tracked private files
        run: |
          set -e
          IGNORED_TRACKED="$(git ls-files -z | xargs -0 git check-ignore --no-index 2>/dev/null || true)"
          if [ -n "$IGNORED_TRACKED" ]; then
            echo "FORBIDDEN tracked gitignored file(s): $IGNORED_TRACKED"
            exit 1
          fi
          for f in .env .dev_sync_config.json APPLICATIONS.md UPDATES.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "FORBIDDEN tracked file: $f"
              exit 1
            fi
          done
          echo "No forbidden private files tracked"
